org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# AGP 9's built-in Kotlin is NOT usable yet for this project:
#   - it resolves Kotlin 2.2.10 (AGP's bundled KGP), below the 2.2.20 floor
#     Flutter 3.47 enforces, which fails configuration before anything builds;
#   - installed_apps and wakelock_plus still apply the Kotlin Gradle Plugin
#     themselves, so Flutter's migrator re-adds this flag on every build.
# Both are upstream, so we take AGP's documented opt-out and keep the Kotlin
# Gradle Plugin, pinned to 2.3.20 (past Flutter's floor and its 2.3.20
# deprecation threshold). Drop these two lines once every plugin has migrated
# and AGP ships a newer built-in Kotlin.
android.newDsl=false
android.builtInKotlin=false
