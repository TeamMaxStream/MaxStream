name: Attach desktop installers to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing the maxstream-desktop artifact
        required: true
        default: "40284197834"
      tag:
        description: Release tag to attach the installers to
        required: true
        default: v1.8.0

permissions:
  actions: read
  contents: write

jobs:
  attach:
    name: Attach desktop installers
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: maxstream-desktop
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installers
        run: |
          set -euo pipefail
          ls -lh dist
          msi="$(stat -c%s dist/MaxStream-Desktop.msi)"
          exe="$(stat -c%s dist/MaxStream-Dex.exe)"
          test "$msi" -gt 1000000
          test "$exe" -gt 5000000

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/MaxStream-Desktop.msi dist/MaxStream-Dex.exe --clobber --repo "$GITHUB_REPOSITORY"
