name: Attach desktop installers to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing the maxstream-desktop-msi/-exe artifacts
        required: true
        default: "40284197834"
      tag:
        description: Release tag to attach the installers to
        required: true
        default: v1.8.0

permissions:
  actions: read
  contents: write

jobs:
  attach:
    name: Attach desktop installers
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: maxstream-desktop-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installers
        run: |
          set -euo pipefail
          ls -lh dist
          msi="$(stat -c%s dist/MaxStream-Desktop.msi)"
          exe="$(stat -c%s dist/MaxStream-Dex.exe)"
          test "$msi" -gt 1000000
          test "$exe" -gt 5000000

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/MaxStream-Desktop.msi dist/MaxStream-Dex.exe --clobber --repo "$GITHUB_REPOSITORY"

      # The sidecar must cover every asset, not just the desktop installers.
      # Recompute it from the whole release after the upload so phone, TV, and
      # desktop updaters all see matching hashes.
      - name: Refresh SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --clobber --repo "$GITHUB_REPOSITORY"
          rm -f release-assets/SHA256SUMS
          (cd release-assets \
            && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
          cat release-assets/SHA256SUMS
          gh release upload "$TAG" release-assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
