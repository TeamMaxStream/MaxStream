name: Build MaxStream (Mobile + TV + Desktop)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Flutter Mobile APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      EXCLUDE_TV: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks

      - name: Decode Google Services
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -di > android/app/google-services.json

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storeFile=../app/key.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> android/keystore.properties

      - name: Validate signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Mobile APKs (split per ABI)
        run: |
          # --split-per-abi produces app-arm64-v8a, app-armeabi-v7a and
          # app-x86_64 release APKs. Flutter 3.47 no longer ships a 32-bit x86
          # Android engine (its AndroidArch enum only has armeabi-v7a,
          # arm64-v8a and x86_64), so there is no x86 split to publish. The step
          # below still handles one if a future toolchain adds it, but never
          # fails the build when it is absent.
          # Flutter's post-build check looks for app-release.apk (single) and fails, so || true
          flutter build apk --release --split-per-abi || true
          APKS=build/app/outputs/flutter-apk
          # Verify the splits we depend on actually exist
          ls -lh $APKS/app-arm64-v8a-release.apk
          ls -lh $APKS/app-armeabi-v7a-release.apk
          ls -lh $APKS/app-x86_64-release.apk
          # Copy into per-ABI folders for clean artifact upload
          mkdir -p $APKS/arm64-v8a $APKS/armeabi-v7a $APKS/x86_64
          cp $APKS/app-arm64-v8a-release.apk $APKS/arm64-v8a/maxstream-arm64-v8a.apk
          cp $APKS/app-armeabi-v7a-release.apk $APKS/armeabi-v7a/maxstream-armeabi-v7a.apk
          cp $APKS/app-x86_64-release.apk $APKS/x86_64/maxstream-x86_64.apk
          # Optional 32-bit x86: only when the toolchain actually emits it.
          if [ -f $APKS/app-x86-release.apk ]; then
            mkdir -p $APKS/x86
            cp $APKS/app-x86-release.apk $APKS/x86/maxstream-x86.apk
            echo "32-bit x86 APK produced"
          else
            echo "No 32-bit x86 APK (Flutter no longer ships that engine) - skipping"
          fi

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-arm64-v8a
          path: build/app/outputs/flutter-apk/arm64-v8a/maxstream-arm64-v8a.apk
          retention-days: 7

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-armeabi-v7a
          path: build/app/outputs/flutter-apk/armeabi-v7a/maxstream-armeabi-v7a.apk
          retention-days: 7

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-x86_64
          path: build/app/outputs/flutter-apk/x86_64/maxstream-x86_64.apk
          retention-days: 7

      - name: Upload x86 APK (only if the toolchain produced one)
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-x86
          path: build/app/outputs/flutter-apk/x86/maxstream-x86.apk
          retention-days: 7
          if-no-files-found: ignore

  build-tv:
    name: Kotlin TV APK (FossUniversalRelease)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storeFile=../app/key.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> android/keystore.properties

      - name: Validate signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-tv-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Compile Kotlin (Foss / Universal) — ./gradlew compileFossUniversalReleaseKotlin
        run: cd android && ./gradlew compileFossUniversalReleaseKotlin --no-daemon

      - name: List tvapp assemble tasks
        run: cd android && ./gradlew :tvapp:tasks --all | grep -i "assemble" || true

      - name: Assemble release APK
        run: cd android && ./gradlew assembleFossUniversalRelease --no-daemon

      - name: Inspect tvapp build outputs after assemble
        run: |
          echo "PWD=$(pwd)"
          ls -la build/tvapp/outputs || true
          find build/tvapp -maxdepth 6 -type f | sed 's#^#FILE #' || true

      - name: Name TV APK for release
        run: |
          mkdir -p release-artifact
          apk="$(find build/tvapp -maxdepth 6 -name '*.apk' -type f | head -n1)"
          test -n "$apk"
          cp "$apk" "release-artifact/maxstream-tv.apk"

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-tv
          path: release-artifact/maxstream-tv.apk
          retention-days: 7

  build-desktop:
    name: Kotlin Desktop (Windows installers)
    runs-on: windows-latest
    env:
      # Authenticates the fallback lookup for mpv's rolling git-release assets,
      # avoiding shared-IP API rate limits on hosted runners.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Desktop targets JVM 17 (desktop/build.gradle.kts jvmToolchain(17)),
      # so install 17 to avoid a Gradle toolchain download on CI.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/compose-compiler
          key: ${{ runner.os }}-gradle-desktop-${{ hashFiles('desktop/**/*.gradle*') }}

      # libmpv is downloaded by the syncMpvRuntime Gradle task during packaging.
      # The archive is cached under ~/.gradle/caches/maxstream-mpv, which the
      # Gradle cache step above restores on subsequent runs.
      - name: Compile + test desktop app
        run: cd desktop; ./gradlew.bat build --no-daemon

      # Must be packageReleaseMsi/Exe: the default build type skips ProGuard
      # entirely, shipping the full ~37 MB material-icons-extended jar plus
      # every unused class. The release tasks shrink it to what Main.kt
      # actually references.
      - name: Package Windows MSI
        run: cd desktop; ./gradlew.bat packageReleaseMsi --no-daemon

      # EXE is the manually distributable MaxStream-Dex.exe installer. Both
      # installers are required: the desktop updater prefers the EXE and falls
      # back to the MSI, and the release must contain the full installer rather
      # than a raw launcher.
      - name: Package Windows EXE installer
        run: cd desktop; ./gradlew.bat packageReleaseExe --no-daemon

      # Normalise both installers into the names users see in the release.
      - name: Stage desktop installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $msi = Get-ChildItem desktop/build/compose/binaries -Recurse -Filter *.msi |
            Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist/MaxStream-Desktop.msi"
          } else {
            throw "No MSI was produced"
          }
          $exe = Get-ChildItem desktop/build/compose/binaries -Recurse -Filter *.exe |
            Where-Object { $_.Directory.Name -eq 'exe' } |
            Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "dist/MaxStream-Dex.exe"
            Write-Host "Staged $($exe.Name) as MaxStream-Dex.exe"
          } else {
            throw "No EXE installer was produced"
          }

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-desktop
          path: dist/*
          retention-days: 7

  # One tag publishes all three apps to one release. This is what the phone,
  # TV, and desktop updaters read: the same vX.Y.Z tag, with one asset per
  # platform. Run it only for tags; normal branch/PR builds stay as artifacts.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mobile, build-tv, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # All three apps must report the same version before anything is
      # published. This catches a forgotten pubspec/TV/desktop bump.
      - name: Verify shared version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUB="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d+ -f1)"
          TV="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/tvapp/build.gradle.kts | head -1)"
          DESKTOP="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' desktop/build.gradle.kts | head -1)"
          PACKAGE="$(sed -n 's/.*packageVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' desktop/build.gradle.kts | head -1)"
          APP="$(sed -n 's/.*APP_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' desktop/src/main/kotlin/com/maxstream/app/core/AppConfig.kt | head -1)"
          echo "tag=$VERSION pubspec=$PUB tv=$TV desktop=$DESKTOP package=$PACKAGE app=$APP"
          for pair in "pubspec:$PUB" "tvapp:$TV" "desktop:$DESKTOP" "packageVersion:$PACKAGE" "AppConfig:$APP"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$value" != "$VERSION" ]; then
              echo "::error::$name is $value but the tag is $VERSION"
              exit 1
            fi
          done

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 2 -type f -printf '%f %s bytes\n' | sort

      # Every app reads the same release, so refusing to publish a partial one
      # matters more than publishing something. In particular the EXE must be
      # the full installer (a raw jpackage launcher is only a few dozen KB).
      - name: Verify all release assets
        run: |
          set -euo pipefail
          missing=0
          for f in \
            maxstream-arm64-v8a.apk \
            maxstream-armeabi-v7a.apk \
            maxstream-x86_64.apk \
            maxstream-tv.apk \
            MaxStream-Dex.exe \
            MaxStream-Desktop.msi; do
            if [ ! -s "release-assets/$f" ]; then
              echo "::error::Release is missing $f"
              missing=1
            fi
          done
          exe_size="$(stat -c%s release-assets/MaxStream-Dex.exe 2>/dev/null || echo 0)"
          msi_size="$(stat -c%s release-assets/MaxStream-Desktop.msi 2>/dev/null || echo 0)"
          echo "MaxStream-Dex.exe=$exe_size bytes MaxStream-Desktop.msi=$msi_size bytes"
          if [ "$exe_size" -lt 5000000 ]; then
            echo "::error::MaxStream-Dex.exe is only $exe_size bytes; that is the launcher, not the installer"
            missing=1
          fi
          if [ "$msi_size" -lt 1000000 ]; then
            echo "::error::MaxStream-Desktop.msi is only $msi_size bytes"
            missing=1
          fi
          exit "$missing"

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
